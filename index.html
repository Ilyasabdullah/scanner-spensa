<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRESENSI EKSTRAKURIKULER</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background: linear-gradient(135deg, #0f172a, #1e1b4b); color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; text-align: center; min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 20px; max-width: 420px; margin: 0 auto; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
    h1 { color: #60a5fa; margin-bottom: 5px; font-size: 24px; letter-spacing: 1px; }
    .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    select { width: 100%; padding: 14px; margin-bottom: 20px; border-radius: 12px; background: rgba(15, 23, 42, 0.8); color: white; border: 1px solid #3b82f6; font-size: 15px; font-weight: bold; outline: none; transition: 0.3s; }
    #reader-container { background-color: #000; border-radius: 12px; padding: 5px; border: 2px solid rgba(59, 130, 246, 0.5); overflow: hidden; position: relative;}
    #reader { width: 100%; border-radius: 8px; }
    .btn-kamera { background: linear-gradient(to right, #2563eb, #4f46e5); color: white; border: none; padding: 14px 20px; font-size: 15px; border-radius: 12px; cursor: pointer; margin-top: 20px; width: 100%; font-weight: bold; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
    #gps-status { font-size: 11px; margin-top: 15px; color: #94a3b8; }
    
    /* STYLE UNTUK LINK LOGIN */
    .login-link { display: inline-block; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); width: 100%; color: #94a3b8; text-decoration: none; font-size: 13px; font-weight: bold; transition: color 0.3s; cursor: pointer; }
    .login-link:hover { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="glass-card">
      <h1>PRESENSI ESKUL</h1>
      <p class="subtitle">Silakan Pilih Ekstrakurikuler & Scan Kartu</p>

      <select id="pilihan_eskul">
        <option value="" disabled selected>-- Pilih Ekstrakurikuler --</option>
        <option value="Pramuka">Pramuka</option>
        <option value="Olah Raga">Olah Raga</option>
        <option value="Seni">Seni</option>
      </select>

      <div id="reader-container"><div id="reader"></div></div>
      <button class="btn-kamera" onclick="gantiKamera()">🔄 Ganti Kamera</button>
      <div id="gps-status">📍 Menunggu Izin Lokasi (GPS)...</div>
      
      <!-- TOMBOL / LINK LOGIN DI BAGIAN BAWAH -->
      <a class="login-link" onclick="bukaDashboard()">
         🔐 Login Admin / Pembina
      </a>
  </div>

  <script>
    // PASTIKAN URL INI SUDAH DIISI DENGAN URL DEPLOY APLIKASI WEB GAS ANDA
    const urlServer = "https://script.google.com/macros/s/AKfycbxza7hRUEHOpi0W8NHLjTOS4RCCDx9Dza3aea4Nt8Zvc_ZYuo-9_9xc3XCJW09CdYtl/exec"; 
    const beepSound = new Audio("https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3");

    let html5QrcodeScanner, modeKamera = "environment", isScanning = false;
    let userLat = "", userLng = "";

    // FUNGSI UNTUK MEMBUKA HALAMAN LOGIN/DASHBOARD
    function bukaDashboard() {
        if(urlServer === "https://script.google.com/macros/s/AKfycbxza7hRUEHOpi0W8NHLjTOS4RCCDx9Dza3aea4Nt8Zvc_ZYuo-9_9xc3XCJW09CdYtl/exec" || urlServer === "") {
            Swal.fire('Peringatan', 'URL Server belum diatur di script index.html', 'warning');
        } else {
            window.location.href = urlServer;
        }
    }

    window.addEventListener('touchstart', () => { beepSound.load(); }, { once: true });
    window.addEventListener('click', () => { beepSound.load(); }, { once: true });

    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (p) => { 
            userLat = p.coords.latitude; userLng = p.coords.longitude; 
            document.getElementById('gps-status').innerHTML = "📍 GPS Terkunci (Siap Scan)";
            document.getElementById('gps-status').style.color = "#4ade80";
          },
          (e) => { 
            document.getElementById('gps-status').innerHTML = "❌ Izin GPS Ditolak / Tidak Aktif";
            document.getElementById('gps-status').style.color = "#f87171";
          },
          { enableHighAccuracy: true }
        );
      }
    }

    function onScanSuccess(decodedText) {
      if(isScanning) return; 
      
      const eskul = document.getElementById('pilihan_eskul').value;
      if (!eskul) {
          Swal.fire({ icon: 'warning', title: 'Pilih Eskul!', text: 'Pilih Ekstrakurikuler terlebih dahulu.', background: '#1e293b', color: '#fff' });
          return;
      }

      isScanning = true;
      beepSound.play().catch(e => console.log(e));
      const finalId = decodedText.trim().replace(/[^a-zA-Z0-9]/g, '');

      Swal.fire({ title: 'Memproses...', text: 'Mengirim data...', allowOutsideClick: false, background: '#1e293b', color: '#fff', didOpen: () => { Swal.showLoading(); }});

      const params = new URLSearchParams();
      params.append("id", finalId); 
      params.append("eskul", eskul);
      params.append("waktu_scan", new Date().toISOString());
      params.append("lat", userLat);
      params.append("lng", userLng);

      fetch(urlServer, { method: "POST", body: params })
      .then(res => res.text())
      .then(pesan => {
          if (pesan.includes("Berhasil")) {
             Swal.fire({ icon: 'success', title: 'Berhasil', text: pesan.split("|")[1] + " - " + eskul, timer: 2000, showConfirmButton: false, background: '#1e293b', color: '#fff' });
          } else if (pesan.includes("Gagal")) {
             Swal.fire({ icon: 'error', title: 'Ditolak', text: pesan.split("|")[1], background: '#1e293b', color: '#fff' });
          } else {
             Swal.fire({ icon: 'warning', title: 'Peringatan', text: pesan.split("|")[1], timer: 3000, showConfirmButton: false, background: '#1e293b', color: '#fff' });
          }
          setTimeout(() => { isScanning = false; }, 2500);
      })
      .catch(() => {
          Swal.fire({ icon: 'error', title: 'Offline', text: 'Koneksi ke server terputus.', timer: 2000, background: '#1e293b', color: '#fff' });
          setTimeout(() => { isScanning = false; }, 2000);
      });
    }

    function mulaiKamera() {
      html5QrcodeScanner.start({ facingMode: modeKamera }, { fps: 15, qrbox: 250 }, onScanSuccess).catch(err => console.log(err));
    }
    
    function gantiKamera() {
      html5QrcodeScanner.stop().then(() => { modeKamera = modeKamera === "environment" ? "user" : "environment"; mulaiKamera(); });
    }
    
    window.onload = function() {
      getLocation();
      html5QrcodeScanner = new Html5Qrcode("reader");
      mulaiKamera();
    };
  </script>
</body>
</html>
