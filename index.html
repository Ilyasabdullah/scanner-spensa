<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRESENSI EKSTRAKURIKULER</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log(err));
      });
    }
  </script>
  <style>
    body { background-color: #0f141e; color: #ffffff; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
    h1 { color: #3498db; margin-bottom: 5px; font-size: 24px; }
    .subtitle { color: #8b9bb4; font-size: 14px; margin-bottom: 15px; }
    select { width: 100%; max-width: 400px; padding: 12px; margin-bottom: 15px; border-radius: 8px; background: #1a2233; color: white; border: 1px solid #3498db; font-size: 16px; font-weight: bold; }
    #reader-container { background-color: #000; border-radius: 12px; padding: 5px; margin: 0 auto; max-width: 400px; border: 2px solid #3498db; overflow: hidden; }
    #reader { width: 100%; border-radius: 8px; }
    .btn-kamera { background-color: #2980b9; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; margin-top: 15px; width: 100%; max-width: 400px; font-weight: bold; }
    #fullscreen-alert { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 20px; text-align: center; }
    .bg-green { background-color: #27ae60; } .bg-red { background-color: #c0392b; } .bg-blue { background-color: #2980b9; }
    .spinner { border: 6px solid rgba(255,255,255,0.3); border-top: 6px solid #ffffff; border-radius: 50%; width: 70px; height: 70px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>PRESENSI ESKUL</h1>
  <p class="subtitle">Silakan Pilih Ekstrakurikuler & Scan Kartu</p>

  <select id="pilihan_eskul">
    <option value="Pramuka">Pramuka</option>
    <option value="Olah Raga">Olah Raga</option>
    <option value="Seni">Seni</option>
  </select>

  <div id="reader-container"><div id="reader"></div></div>
  <button class="btn-kamera" onclick="gantiKamera()">🔄 Ganti Kamera</button>

  <div id="fullscreen-alert">
    <div id="alert-icon" style="font-size:80px; margin-bottom:10px;"></div>
    <h2 id="alert-title" style="font-size:24px; margin:0 0 10px 0;"></h2>
    <p id="alert-desc" style="font-size:16px; opacity:0.9;"></p>
  </div>

  <script>
    const urlServer = "https://script.google.com/macros/s/AKfycbxza7hRUEHOpi0W8NHLjTOS4RCCDx9Dza3aea4Nt8Zvc_ZYuo-9_9xc3XCJW09CdYtl/exec"; 
    let html5QrcodeScanner, modeKamera = "environment", isScanning = false, scanQueue = JSON.parse(localStorage.getItem('eskulQueue')) || [];

    function tampilkanAlert(judul, pesan, tipe) {
        const box = document.getElementById('fullscreen-alert');
        box.className = tipe === 'loading' ? 'bg-blue' : (tipe === 'sukses' ? 'bg-green' : 'bg-red');
        box.style.display = 'flex';
        document.getElementById('alert-title').innerHTML = judul;
        document.getElementById('alert-desc').innerHTML = pesan;
        document.getElementById('alert-icon').innerHTML = tipe === 'loading' ? '<div class="spinner"></div>' : (tipe === 'sukses' ? '✅' : '❌');
        
        if(tipe !== 'loading') {
            setTimeout(() => { box.style.display = "none"; isScanning = false; }, 1500);
        }
    }

    function onScanSuccess(decodedText) {
      if(isScanning) return; 
      isScanning = true;
      const eskul = document.getElementById('pilihan_eskul').value;
      const finalId = decodedText.trim().replace(/[^a-zA-Z0-9]/g, ''); // Ekstrak NISN bersih

      const dataScan = { id: finalId, eskul: eskul, waktu_scan: new Date().toISOString() };

      if (!navigator.onLine) {
         scanQueue.push(dataScan);
         localStorage.setItem('eskulQueue', JSON.stringify(scanQueue));
         tampilkanAlert("OFFLINE", "Disimpan ke antrean.", "sukses");
      } else {
         kirimKeServer(dataScan);
      }
    }

    function kirimKeServer(data) {
      tampilkanAlert("MEMPROSES...", "Mengirim data ke server.", "loading");
      const params = new URLSearchParams();
      params.append("id", data.id); 
      params.append("eskul", data.eskul);
      params.append("waktu_scan", data.waktu_scan);

      fetch(urlServer, { method: "POST", body: params })
      .then(res => res.text())
      .then(pesan => {
          if (pesan.includes("Berhasil")) {
             tampilkanAlert("SUKSES", pesan.split("|")[1] + "<br>" + data.eskul, "sukses");
          } else {
             tampilkanAlert("GAGAL", pesan, "error");
          }
      })
      .catch(() => {
          scanQueue.push(data); localStorage.setItem('eskulQueue', JSON.stringify(scanQueue));
          tampilkanAlert("OFFLINE", "Gagal kirim, masuk antrean.", "sukses");
      });
    }

    function mulaiKamera() {
      html5QrcodeScanner.start({ facingMode: modeKamera }, { fps: 15, qrbox: 250 }, onScanSuccess).catch(err => console.log(err));
    }

    function gantiKamera() {
      html5QrcodeScanner.stop().then(() => {
        modeKamera = modeKamera === "environment" ? "user" : "environment";
        mulaiKamera();
      });
    }

    window.onload = function() {
      html5QrcodeScanner = new Html5Qrcode("reader");
      mulaiKamera();
    };
  </script>
</body>
</html>
